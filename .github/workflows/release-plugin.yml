name: Release Plugin

on:
  push:
    tags:
      - 'plugin/*@v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing plugin release tag (for example, plugin/openmz-updater@v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-plugin-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Resolve plugin metadata from tag
        id: plugin
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^plugin/([a-z0-9][a-z0-9-]*)@v(.+)$ ]]; then
            echo "Invalid plugin tag format: $RELEASE_TAG (expected plugin/<dir>@v<version>)" >&2
            exit 1
          fi
          PLUGIN_DIR="${BASH_REMATCH[1]}"
          PLUGIN_VERSION="${BASH_REMATCH[2]}"
          PKG_FILE="plugins/${PLUGIN_DIR}/package.json"
          if [[ ! -f "$PKG_FILE" ]]; then
            echo "Plugin package not found: $PKG_FILE" >&2
            exit 1
          fi
          PKG_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).version" "$PKG_FILE")"
          if [[ "$PKG_VERSION" != "$PLUGIN_VERSION" ]]; then
            echo "Tag version ($PLUGIN_VERSION) does not match $PKG_FILE version ($PKG_VERSION)" >&2
            exit 1
          fi
          echo "dir=$PLUGIN_DIR" >> "$GITHUB_OUTPUT"
          echo "version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
      - run: pnpm --filter "./plugins/${{ steps.plugin.outputs.dir }}" run build
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.plugin.outputs.dir }} v${{ steps.plugin.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            plugins/${{ steps.plugin.outputs.dir }}/dist/*.js
