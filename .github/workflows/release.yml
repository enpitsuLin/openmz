name: Release OpenMZ

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v2.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Detect prerelease from tag
        id: tag
        shell: bash
        run: |
          case "${RELEASE_TAG%%+*}" in
            *-*) echo "prerelease=true" ;;
            *) echo "prerelease=false" ;;
          esac >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
      - run: pnpm --filter openmz run pack
      - run: pnpm --filter './plugins/*' run build
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            packages/openmz/dist/release/openmz-core-*.tar.gz
            packages/openmz/dist/release/manifest.json
            plugins/*/dist/*.js
